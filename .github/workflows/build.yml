name: Build

# Pull requests: tests, builds and checks of every platform, release files checked
# but not published. Tags v*: the same, then the GitHub Release (the tag must be the
# version in CMakeLists.txt). Nothing is kept as an Actions artifact: the zips go
# only to the release, built and attached in the same job.
on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGINVAL_VERSION: v1.0.4
  # SHA-256 of the pluginval v1.0.4 downloads: a changed file stops the build
  PLUGINVAL_SHA256_LINUX: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  # Unit tests (GoogleTest) with AddressSanitizer and UBSan, line coverage of src/,
  # and the tests of the release scripts.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev \
            libglu1-mesa-dev xvfb pandoc gcovr

      - name: Configure (Debug, tests, sanitizers, coverage)
        run: >
          cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCOPY_PLUGIN=OFF
          -DPARALLAXSTYLE_TESTS=ON -DPARALLAXSTYLE_SANITIZERS=ON -DPARALLAXSTYLE_COVERAGE=ON

      - name: Build the tests
        run: cmake --build build-tests --parallel --target ParallaxStyleTests ParallaxStyleAnagramTests

      - name: Run the tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: xvfb-run -a ctest --test-dir build-tests --output-on-failure --parallel 4

      - name: Coverage of src/ (at least 80% of the lines)
        run: >
          gcovr --root . --filter 'src/' --object-directory build-tests
          --print-summary --fail-under-line 80

  # Linux first: on a tag it creates the release, Windows and macOS add their files.
  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev \
            libglu1-mesa-dev xvfb pandoc

      - name: Version (a tag must match CMakeLists.txt)
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=$(bash scripts/version.sh "$GITHUB_REF_NAME"); else V=$(bash scripts/version.sh); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF
          cmake --build build --parallel

      - name: pluginval, strictness 10
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Linux.zip"
          echo "$PLUGINVAL_SHA256_LINUX  pluginval.zip" | sha256sum -c -
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --validate "build/ParallaxStyle_artefacts/Release/VST3/ParallaxStyle-$(echo ${{ steps.ver.outputs.version }} | tr . _).vst3"

      - name: The Standalone starts and prints its version
        run: |
          set +e
          timeout 10 xvfb-run -a "build/ParallaxStyle_artefacts/Release/Standalone/ParallaxStyle-$(echo ${{ steps.ver.outputs.version }} | tr . _)" > standalone.log 2>&1
          code=$?
          set -e
          cat standalone.log
          [ "$code" -eq 124 ] || { echo "::error::the Standalone exited with $code before 10 seconds"; exit 1; }
          grep -q "ParallaxStyle ${{ steps.ver.outputs.version }}" standalone.log

      - name: PDF guide
        run: bash scripts/build-guide.sh "${{ steps.ver.outputs.version }}" "guide/ParallaxStyle-${{ steps.ver.outputs.version }}-Guida.pdf"

      - name: Package
        run: |
          bash scripts/package.sh "${{ steps.ver.outputs.version }}" linux build/ParallaxStyle_artefacts/Release \
            "guide/ParallaxStyle-${{ steps.ver.outputs.version }}-Guida.pdf" release
          ls -la release

      - name: GitHub Release
        uses: Darkglassd3v/.github/actions/release@v1
        with:
          version: ${{ steps.ver.outputs.version }}
          files: release/*.zip
          changelog: docs/ParallaxStyle.md
          title: ParallaxStyle v${{ steps.ver.outputs.version }}

  windows-macos:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Version (a tag must match CMakeLists.txt)
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=$(bash scripts/version.sh "$GITHUB_REF_NAME"); else V=$(bash scripts/version.sh); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build (Release; macOS universal arm64 + x86_64)
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF
          fi
          cmake --build build --config Release --parallel

      - name: pluginval, strictness 10
        run: |
          F=$(echo "${{ steps.ver.outputs.version }}" | tr . _)
          if [ "${{ matrix.platform }}" = macos ]; then
            curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
            echo "$PLUGINVAL_SHA256_MACOS  pluginval.zip" | shasum -a 256 -c -
            unzip -q pluginval.zip
            PV=pluginval.app/Contents/MacOS/pluginval
          else
            curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
            echo "$PLUGINVAL_SHA256_WINDOWS  pluginval.zip" | sha256sum -c -
            unzip -q pluginval.zip
            PV=./pluginval.exe
          fi
          "$PV" --strictness-level 10 --validate-in-process --timeout-ms 300000 \
            --validate "build/ParallaxStyle_artefacts/Release/VST3/ParallaxStyle-$F.vst3"

      - name: The Standalone starts and stays open
        run: |
          V="${{ steps.ver.outputs.version }}"
          F=$(echo "$V" | tr . _)
          if [ "${{ matrix.platform }}" = macos ]; then
            APP="build/ParallaxStyle_artefacts/Release/Standalone/ParallaxStyle-$F.app/Contents/MacOS/ParallaxStyle-$F"
          else
            APP="build/ParallaxStyle_artefacts/Release/Standalone/ParallaxStyle-$F.exe"
          fi
          "$APP" > standalone.log 2>&1 &
          PID=$!
          sleep 10
          kill -0 "$PID" || { cat standalone.log; echo "::error::the Standalone closed before 10 seconds"; exit 1; }
          kill "$PID" || true
          cat standalone.log
          # the console banner is printed on macOS; on Windows it goes to the debugger output
          if [ "${{ matrix.platform }}" = macos ]; then grep -q "ParallaxStyle $V" standalone.log; fi

      - name: pandoc
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then brew install pandoc; else choco install pandoc -y --no-progress; fi

      - name: PDF guide
        run: |
          export PATH="$PATH:/c/Program Files/Pandoc"
          bash scripts/build-guide.sh "${{ steps.ver.outputs.version }}" "guide/ParallaxStyle-${{ steps.ver.outputs.version }}-Guida.pdf"

      - name: Package
        run: |
          bash scripts/package.sh "${{ steps.ver.outputs.version }}" "${{ matrix.platform }}" build/ParallaxStyle_artefacts/Release \
            "guide/ParallaxStyle-${{ steps.ver.outputs.version }}-Guida.pdf" release
          ls -la release

      - name: install.bat installs the plugin and removes older versions
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dest = Join-Path $env:CommonProgramFiles "VST3"
          New-Item -ItemType Directory -Force (Join-Path $dest "ParallaxStyle.vst3") | Out-Null
          $f = $v.Replace(".", "_")
          New-Item -ItemType Directory -Force (Join-Path $dest "ParallaxStyle-1_8_0.vst3") | Out-Null
          Expand-Archive "release/ParallaxStyle-$v-windows-vst3.zip" -DestinationPath unpacked
          cmd /c "echo.| unpacked\install.bat"
          if (-not (Test-Path (Join-Path $dest "ParallaxStyle-$f.vst3\Contents"))) { Write-Error "not installed"; exit 1 }
          if (Test-Path (Join-Path $dest "ParallaxStyle.vst3")) { Write-Error "old unversioned bundle left"; exit 1 }
          if (Test-Path (Join-Path $dest "ParallaxStyle-1_8_0.vst3")) { Write-Error "old 1.8.0 bundle left"; exit 1 }

      - name: GitHub Release
        uses: Darkglassd3v/.github/actions/release@v1
        with:
          version: ${{ steps.ver.outputs.version }}
          files: release/*.zip
          changelog: docs/ParallaxStyle.md
          title: ParallaxStyle v${{ steps.ver.outputs.version }}
          replace: "true"
