name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libglu1-mesa-dev

      - name: Configure (Linux / Windows)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package binaries
        shell: bash
        run: |
          # Versione: dal tag se presente, altrimenti dev-<sha>
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # File info incluso in ogni zip
          cat > info.txt << INFO
          ParallaxStyle ${VERSION}
          platform: ${{ matrix.name }}
          commit:   ${GITHUB_SHA}
          built:    $(date -u +"%Y-%m-%d %H:%M UTC")
          repo:     ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          INFO

          mkdir -p dist
          cd build/ParallaxStyle_artefacts
          SRC=.
          [ -d Release ] && SRC=Release
          cd "$SRC"
          cp "$GITHUB_WORKSPACE/info.txt" .
          7z a "$GITHUB_WORKSPACE/dist/ParallaxStyle-${VERSION}-${{ matrix.name }}-vst3.zip" VST3/ info.txt
          7z a "$GITHUB_WORKSPACE/dist/ParallaxStyle-${VERSION}-${{ matrix.name }}-standalone.zip" Standalone/ info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxStyle-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true